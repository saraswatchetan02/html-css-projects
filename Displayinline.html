<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            margin: 10px;
            border: 2px solid;
            color:bisque;
            padding: 20px;
            border-color: aqua;
            background-color: rgb(215, 45, 45);
        }
        .inline block{
            width:10px;
            display: inline-block;
            height:50px;
            background-color:blue;
            margin:10px;
        }
        .block2{
            margin: 10px;
            border: 2px solid;
            color:bisque;
            padding: 20px;
            border-color: aqua;
            background-color: rgb(215, 45, 45);
        }
        .block3{
            width:10px;
            display: block;
            height:50px;
            background-color:blue;
            margin:10px;
        }
    </style>
</head>
<body>
    <div class="block">
        <h1>Display block</h1>
        <h3 class ="inline block">Hii</h3>
        <h3 class ="inline block">Hello</h3>
        <h3 class ="inline block">Welcome</h3>
    </div>
    <div class="block2">
       <h1 class="block3">Display block</h1>
        <h3 class ="block3">Hii</h3>
        <h3 class ="block3">Hello</h3>
        <h3 class ="block3">Welcome</h3>  
    </div>
</body>
</html>
